<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="gen-style.css"> <!-- Link para o arquivo de estilos CSS -->
    <title>Port. Js - Anhanguera</title>
</head>

<body>
    <!-- Título principal do projeto -->
    <h1>Bem-vindo ao Projeto da Anhanguera</h1>

    <!-- Descrição do projeto -->
    <p>Este é um projeto criado com a finalidade de expressar meus conhecimentos utilizando JavaScript, incluindo utilização de HTML e CSS.</p>

    <!-- Subtítulo para a seção do formulário -->
    <div>
        <h2>Formulário</h2>
    </div>

    <!-- Início do formulário. A função JavaScript 'validarFormulario()' será chamada ao enviar. -->
    <form id="formulario" onsubmit="return validarFormulario()"> 

        <!-- Campo de entrada para o nome -->
        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome"><br><br>

        <!-- Campo de entrada para o CPF -->
        <label for="cpf">CPF:</label><br>
        <input type="text" id="cpf" name="cpf" maxlength="14" placeholder="000.000.000-00"><br><br>

        <!-- Campo de entrada para o email -->
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <!-- Campo de entrada para o telefone -->
        <label for="telefone">Telefone:</label><br>
        <input type="text" id="telefone" name="telefone" value="+55 " maxlength="20" placeholder="+55 (11) 91234-5678"><br><br>
        

        <!-- Campo de texto para a mensagem -->
        <label for="mensagem">Mensagem:</label><br>
        <textarea id="mensagem" name="mensagem"></textarea><br><br>

        <!-- Botão de envio do formulário -->
        <input type="submit" value="Enviar">
    </form>
    <div id="mensagemErro" class="error"></div> <!-- Div para exibir mensagem de erro -->

    <!-- Inclusão do script JavaScript responsável pela validação do formulário -->
    <script src="form.js"></script>
</body>
</html>
